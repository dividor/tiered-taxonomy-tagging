# What the results report says about each method: its description, its kind and its sources.
# Paper details were checked against arXiv and the ACL Anthology on 10 November 2026. `differs` says how
# ours differs from its source, so that the report never presents a reduced method as the original.
kinds:
- kind: LLM
  css: k-llm
  meaning: Prompts a general-purpose LLM. Needs no labelled documents.
- kind: LLM + examples
  css: k-mix
  meaning: Prompts an LLM and shows it labelled training documents.
- kind: LLM + trained model
  css: k-mix
  meaning: An LLM chooses from a shortlist that a trained model helped make.
- kind: No training
  css: k-none
  meaning: Embedding search only. Needs no labelled documents and no LLM.
- kind: Trained
  css: k-trained
  meaning: Learns from the dataset's labelled documents. Trains on a laptop, except XR-Transformer.
- kind: Fine-tuned
  css: k-tuned
  meaning: A pretrained neural model further trained on the dataset, on a rented GPU.
- kind: Combined
  css: k-comb
  meaning: Our method. Several trained models each suggest labels, and a scorer trained on documents they never saw decides which to keep. Which models it draws on is chosen for each dataset.
methods:
  pipeline:
    name: LLM keyword pipeline
    sub: LLMs write keywords; keywords are matched to labels
    kind: LLM
    needs_labels: false
    summary: Two LLMs suggest keywords; each keyword is matched to labels, then rated.
    steps:
    - Text
    - 2 LLMs write keywords
    - Match keywords to labels
    - LLM rates each label
    - Labels
    differs: Two LLMs and one prompt; the paper {cite:kluge2025} uses several of each.
    refs:
    - kluge2025
    - kahler2026
    notebook: '04'
  select_all:
    name: LLM chooses from the full list
    sub: the LLM sees every label at once
    kind: LLM
    needs_labels: false
    summary: The LLM sees every HumSet label at once and picks the ones that fit.
    steps:
    - Excerpt and every label
    - LLM picks
    - Labels
    differs: Our own baseline. It only works for a small taxonomy.
    refs: []
    notebook: '04'
  funnel_names:
    name: Search label names, then LLM chooses
    sub: an LLM picks from the 100 closest labels
    kind: LLM
    needs_labels: false
    summary: Search finds the 100 closest label names; the LLM picks from them.
    steps:
    - Text
    - 'Search: 100 closest names'
    - LLM picks
    - Labels
    differs: One view of the text and no pruning by tier; MATCH uses eight views and prunes.
    refs:
    - match
    notebook: '05'
  funnel_cards:
    name: Search label definitions, then LLM chooses
    sub: as above, matching written definitions
    kind: LLM
    needs_labels: false
    summary: As above, but labels are found and shown through short written definitions.
    steps:
    - Text
    - 'Search: 100 closest definitions'
    - LLM picks
    - Labels
    differs: An LLM wrote the definitions once, from the taxonomy alone.
    refs:
    - match
    - slkr
    notebook: '05'
  funnel_hybrid:
    name: Trained model and search, then LLM chooses
    sub: shortlist from both
    kind: LLM + trained model
    needs_labels: true
    summary: The shortlist mixes a trained model's top labels with search results.
    steps:
    - Text
    - 'Trained model and search: about 96 labels'
    - LLM picks
    - Labels
    differs: Our own variant, run on the laws only.
    refs:
    - match
    notebook: '05'
  funnel_cards_checked:
    name: Search definitions, LLM chooses and double-checks
    sub: a second call checks each label
    kind: LLM
    needs_labels: false
    summary: After picking, a second LLM call keeps only labels it can back with a quote.
    steps:
    - Text
    - Search, then LLM picks
    - LLM checks each label with a quote
    - Labels
    differs: Checks against LLM-written definitions; the paper {cite:cti2ttp} uses its field's official ones.
    refs:
    - cti2ttp
    notebook: '07'
  funnel_cards_quote_filter:
    name: Search definitions, LLM chooses, keep quoted labels
    sub: no extra call
    kind: LLM
    needs_labels: false
    summary: Keeps only picked labels whose supporting quote really is in the text.
    steps:
    - Text
    - Search, then LLM picks with quotes
    - Drop labels without a real quote
    - Labels
    differs: ''
    refs:
    - cti2ttp
    notebook: '07'
  walk_strict:
    name: Tree walk, one branch
    sub: top-down, one path
    kind: LLM
    needs_labels: false
    summary: Walks down the taxonomy from the top, following a single branch.
    steps:
    - Top of the taxonomy
    - LLM picks one child
    - Repeat at each level
    - Label
    differs: Plain top-down routing, used as the point of comparison.
    refs: []
    notebook: '06'
  walk_branching:
    name: Tree walk, three branches
    sub: top-down, several paths
    kind: LLM
    needs_labels: false
    summary: Walks down from the top, keeping up to three branches open.
    steps:
    - Top of the taxonomy
    - LLM picks up to three
    - Repeat at each level
    - Labels
    differs: The paper {cite:gcp} trains its walk; ours prompts an LLM.
    refs:
    - gcp
    notebook: '06'
  walk_anchored:
    name: Tree walk from search results
    sub: starts lower, looks ahead
    kind: LLM
    needs_labels: false
    summary: Starts from labels found by search, and looks ahead before each choice.
    steps:
    - 'Search: 8 starting labels'
    - LLM sees what lies below
    - Picks and moves down
    - Labels
    differs: Leaves out the backtracking with tools in the papers {cite:cas,toticd}.
    refs:
    - cas
    - toticd
    notebook: '06'
  ki_fsprompt:
    name: KI-FSPrompt
    sub: LLM shown similar labelled documents
    kind: LLM + examples
    needs_labels: true
    summary: The LLM sees similar labelled documents before it writes keywords.
    steps:
    - Text
    - Find similar training documents
    - LLM writes keywords
    - Match and rate
    - Labels
    differs: Open LLMs stand in for the paper's {cite:kahler2025}; examples come from our training data.
    refs:
    - kahler2025
    - kahler2026
    notebook: '11'
  llm_ensemble:
    name: LLM-Ensemble
    sub: five LLMs write keywords, one rates them
    kind: LLM
    needs_labels: false
    summary: Five LLMs write keywords; a sixth rates the labels they match.
    steps:
    - Text
    - 5 LLMs write keywords
    - Match to labels
    - Llama-3.1-8B rates
    - Labels
    differs: Five LLMs fixed in advance; the paper {cite:kluge2025} chose its set from 135 combinations.
    refs:
    - kluge2025
    - kahler2026
    notebook: '11'
  omikuji:
    name: Omikuji
    sub: word counts, label trees
    kind: Trained
    needs_labels: true
    summary: A fast classifier on word counts, built for very large label sets.
    steps:
    - First 500 words
    - Word counts
    - Omikuji label trees
    - Labels
    differs: Trains on a laptop in minutes.
    refs:
    - omikuji
    notebook: '10'
  xr_transformer:
    name: XR-Transformer
    sub: the leading trained model in a 2026 benchmark {cite:kahler2026}
    kind: Trained
    needs_labels: true
    summary: A BERT model fine-tuned with word counts, over groups of labels.
    steps:
    - First 30,000 characters
    - BERT and word counts
    - Label groups, then labels
    - Labels
    differs: The benchmark paper {cite:kahler2026} names no base model; we used BERT and multilingual BERT.
    refs:
    - xr
    - kahler2026
    - pecos
    notebook: '10'
  embedding_classifier:
    name: Embedding classifier
    sub: BGE-M3 embeddings, one output per label
    kind: Trained
    needs_labels: true
    summary: A simple classifier on a meaning-based embedding of the text.
    steps:
    - First 500 words
    - BGE-M3 embedding
    - One output per label
    - Labels
    differs: Our own baseline.
    refs:
    - bgem3
    notebook: '10'
  knn:
    name: Similar documents
    sub: labels of the closest training documents
    kind: Trained
    needs_labels: true
    summary: Gives the text the labels of the most similar training documents.
    steps:
    - Text
    - BGE-M3 embedding
    - Nearest training documents
    - Their labels
    differs: Our own baseline.
    refs:
    - bgem3
    notebook: '10'
  label_search:
    name: Label search
    sub: closest label names, no training
    kind: No training
    needs_labels: false
    summary: Returns the labels whose names are closest in meaning to the text.
    steps:
    - Text
    - BGE-M3 embedding
    - Nearest label names
    - Labels
    differs: Needs no labelled documents and no LLM.
    refs:
    - bgem3
    notebook: '10'
  classifier:
    name: Fine-tuned classifier
    name_by_dataset:
      eurlex: Fine-tuned Legal-BERT
      humset: Fine-tuned HumBERT
      humset_v2: Fine-tuned HumBERT
    sub: a BERT-style model with one output per label
    kind: Fine-tuned
    needs_labels: true
    summary: A BERT model fine-tuned with one output per label, as in the benchmarks.
    steps:
    - Text
    - Legal-BERT or HumBERT
    - One output per label
    - Labels
    differs: A plainer fine-tune than HumBERT's authors used, with one shared head and ordinary loss. On HumSet
      it scores level with the authors' own recipe rerun on the same test set (mean macro F1 0.56 for both).
    refs:
    - humbert
    - legalbert
    - multieurlex
    notebook: '14'
  humbert_recipe:
    name: Authors' HumBERT recipe
    sub: the paper's own trainer and settings, rerun {cite:humbert}
    kind: Fine-tuned
    needs_labels: true
    summary: HumBERT fine-tuned with its authors' own code and settings, rerun here on our data.
    steps:
    - Text
    - HumBERT
    - One copy of its top layer per category
    - Labels
    differs: Their trainer, unchanged, with the paper's settings {cite:humbert}. One run, one seed. The paper
      reports macro F1 on all of HumSet 2.0.0's test excerpts. There the rerun comes within 0.015 of every
      printed group if every label is averaged once, and falls short by the trainer's own averaging, which
      averages subpillars within each pillar first (notebook 13). The 2.0.0 table scores it on the same test
      excerpts, with its cut-offs chosen as for every other method there; the 1.0.0 table, on 1,500 sampled
      test excerpts. The note under its macro F1 says what the paper reported and how the measurements differ.
    refs:
    - humbert
    - classifier_trainer
    notebook: '18'
  llm:
    name: Fine-tuned small LLM
    sub: Qwen2.5-7B, used as a classifier
    kind: Fine-tuned
    needs_labels: true
    summary: A 7-billion-parameter LLM fine-tuned to score every label.
    steps:
    - Text
    - Qwen2.5-7B, LoRA-tuned
    - One score per label
    - Labels
    differs: One branch of DualMLC, where the paper {cite:dualmlc} fuses two.
    refs:
    - dualmlc
    - qwen
    - lora
    notebook: '14'
  reranker:
    name: Fine-tuned reranker
    sub: reads text and label together
    kind: Fine-tuned
    needs_labels: true
    summary: Reads the text and one label together and scores how well they fit.
    steps:
    - Shortlist from trained models
    - Read text and label together
    - Score each pair
    - Labels
    differs: The laws run stopped at its 4-hour limit, after one pass.
    refs:
    - bgereranker
    notebook: '14'
  gliner:
    name: GLiNER2.5
    sub: reads text and label names together
    kind: Fine-tuned
    needs_labels: true
    summary: Reads the text with all label names at once and scores each label.
    steps:
    - Text and label names
    - GLiNER2.5
    - A score per label
    - Labels
    differs: Fine-tuned on each dataset; untuned, it scored far lower.
    refs:
    - gliner
    notebook: '15'
  combined:
    name: Combined method
    sub: ''
    kind: Combined
    needs_labels: true
    summary: Gathers clues about every label the models suggest, and a trained scorer decides which to keep.
    steps:
    - Each model's top 30 labels
    - Gather clues for each label
    - A trained scorer weighs the clues
    - Labels above a cut-off
    clues_intro: 'For every candidate label, the scorer looks at:'
    clues:
    - clue: Model scores
      meaning: How strongly each model suggests the label, and how many models suggest it.
    - clue: Name in the text
      meaning: Whether the label's name appears word for word in the document.
    - clue: How common it is
      meaning: How often the label was used in the training documents.
    - clue: Its tier
      meaning: How broad or specific the label is in the taxonomy.
    - clue: Its family
      meaning: How strongly the models suggest the label's parent and its children.
    - clue: Its usual companions
      meaning: How strongly the models suggest labels that often appear with it in training.
    - clue: Its recent history
      meaning: How often it was used in the 5,000 most recent training laws, whether that is rising, and how long
        since it was last used.
      only_with_priors: true
    scorer: 'The scorer is a gradient-boosted model: many small decision trees added together. It learned how much
      to trust each clue from development documents that none of the models had trained on.'
    differs: Our own method. Its second attempt on the laws adds each label's recent history.
    refs: []
    notebook: 14 and 15
