[project]
name = "tiered-taxonomy"
version = "0.1.0"
description = "Testing recent techniques for applying a tiered taxonomy to humanitarian and government text"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.3",
    "numpy>=2.0",
    "omikuji>=0.5",
    "openai>=1.60",
    "huggingface-hub>=0.30",
    "pandas>=2.2",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "sentence-transformers>=6.2.0",
    "rank-bm25>=0.2.2",
    "gliner2>=2.1.0",
    "langchain-anthropic>=0.3",
    "anthropic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    # code quality (the same checks run as pre-commit hooks and in CI)
    "pre-commit>=4.0",
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "bandit>=1.8",
    "lizard>=1.17",
    "radon>=6.0",
    "cognitive-complexity>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiered_taxonomy"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
