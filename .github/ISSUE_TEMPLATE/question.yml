name: Question
description: Ask about the methods, the results or running the code
title: "[Question]: "
labels: ["question", "needs-triage"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      placeholder: What you are trying to do, and what you have tried.
