name: Documentation
description: Something in the README, a notebook's text or a docstring is wrong or unclear
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      placeholder: README.md, notebooks/10_combined_method.ipynb, ...
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is wrong or unclear
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording
