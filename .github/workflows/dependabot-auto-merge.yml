name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  # `gh pr merge --auto` waits for checks only if main's branch protection requires them; without that rule it
  # merges at once. So this runs only on the public repository, where main requires the CI jobs to pass (set in
  # Settings > Branches when the repository is made public). Until then Dependabot's pull requests wait for a person.
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.repository.visibility == 'public'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # Patch and minor updates merge once every required check passes; major updates wait for a person.
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
